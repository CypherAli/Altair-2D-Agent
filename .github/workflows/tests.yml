name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript rig tests
        run: |
          node tests/test_rig.cjs
          node tests/test_character.cjs
          node tests/test_greeting.cjs
          node tests/test_microphone.cjs
      - name: In-browser probe
        run: python tools/probe.py
